# Railway builds the Dockerfile, applies schema.sql, seeds students, then starts Flask.
# DATABASE_URL must come from a Postgres service. The image includes psql.

"$schema" = "https://railway.com/railway.schema.json"

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = 'psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema.sql && python seed.py'
startCommand = "python app.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
